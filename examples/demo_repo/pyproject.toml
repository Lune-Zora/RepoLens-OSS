[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dateparse-demo"
version = "0.1.0"
description = "A tiny date-parsing library used as the RepoLens-OSS demo repository"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
